name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify
        run: npm run verify

  evaluate:
    name: inference quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build CLI
        run: npm run build
      - name: Ingest fixtures and build graph
        run: |
          node dist/cli.js ingest fixtures/*.json
          node dist/cli.js build
      - name: Evaluate against ground truth
        run: node dist/cli.js eval --show-errors
      - name: Benchmark at 700 tools
        run: node dist/cli.js bench --tools 700
      - name: Prove the release gate catches a breaking schema change
        shell: bash
        run: |
          BASELINE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".filura/latest.json", "utf8")).hash)')
          node dist/cli.js ingest fixtures/v2/github.json fixtures/jira.json fixtures/slack.json fixtures/acme-crm.json
          node dist/cli.js build
          CANDIDATE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".filura/latest.json", "utf8")).hash)')
          if node dist/cli.js check "$BASELINE" "$CANDIDATE" --format github; then
            echo "Expected the deliberate breaking change to fail policy."
            exit 1
          fi
